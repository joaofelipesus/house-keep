plugins:
  - rubocop-performance
  - rubocop-rails

AllCops:
  TargetRubyVersion: 3.4
  NewCops: enable
  SuggestExtensions: false
  Exclude:
    - 'db/migrate/**/*'
    - 'db/schema.rb'
    - 'db/queue_schema.rb'
    - 'bin/*'
    - 'vendor/**/*'
    - 'tmp/**/*'
    - 'log/**/*'
    - '.git/**/*'

Style/HashSyntax:
  Enabled: false

Layout/EmptyLinesAroundAttributeAccessor:
  Enabled: true

Layout/LineLength:
  Enabled: true
  Max: 120
  Exclude:
    - 'Gemfile'

Lint/EmptyBlock:
  Exclude:
    - "test/**/*"

Metrics/MethodLength:
  Exclude:
    - "test/**/*"
  CountAsOne: ['array', 'hash', 'heredoc']

Rails/SkipsModelValidations:
  Exclude:
    - "test/**/*"

Naming/VariableNumber:
  Enabled: false

# Persistence methods return true/false like ActiveRecord's own save/update.
Naming/PredicateMethod:
  AllowedMethods:
    - update_bill_with_invoices
    - confirm_payment

Metrics/ClassLength:
  Exclude:
    - "test/**/*"

Style/Documentation:
  Enabled: false

Metrics/BlockLength:
  CountAsOne: ['array', 'hash', 'heredoc']
  Exclude:
    - "test/**/*"
    - "lib/tasks/**/*.rake"

Layout/ParameterAlignment:
  EnforcedStyle: with_fixed_indentation

Rails/I18nLocaleTexts:
  Enabled: false

Rails/StrongParametersExpect:
  Enabled: false

Lint/MissingSuper:
  Enabled: false

Style/OpenStructUse:
  Enabled: false

