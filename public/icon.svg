<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512"
     role="img" aria-label="HouseKeep">
  <defs>
    <linearGradient id="hk-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#4338ca"/>
    </linearGradient>

    <!-- The house is painted white, then the three bars are punched back out of it so the
         background reads through them. Scaled to 0.92 so the whole mark stays inside the
         circle Android crops maskable icons to. -->
    <mask id="hk-mark">
      <g transform="translate(256 262) scale(0.92)">
        <path d="M0 -140 L150 -8 V120 a12 12 0 0 1 -12 12 H-138 a12 12 0 0 1 -12 -12 V-8 Z"
              fill="#fff"/>
        <rect x="-73" y="42" width="34" height="54" rx="8" fill="#000"/>
        <rect x="-17" y="12" width="34" height="84" rx="8" fill="#000"/>
        <rect x="39" y="-18" width="34" height="114" rx="8" fill="#000"/>
      </g>
    </mask>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#hk-bg)"/>
  <rect width="512" height="512" fill="#fff" mask="url(#hk-mark)"/>
</svg>
